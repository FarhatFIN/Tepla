# Phase 1 of the architecture cleanup:
# - default compose now starts only shared infrastructure
# - application services are being consolidated toward 5 core services
# - the previous oversized runtime remains in docker-compose.legacy.yml
#
# Target application services:
# 1. gateway/api-gateway
# 2. services/auth-user-service
# 3. services/messaging-service
# 4. services/media-service
# 5. services/realtime-service
# 6. services/bot-platform-service (optional)

services:
  postgres:
    image: postgres:16-alpine
    container_name: tepla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tepla
      POSTGRES_USER: tepla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tepla_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tepla"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepla-network

  redis:
    image: redis:7-alpine
    container_name: tepla-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepla-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tepla-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - tepla-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tepla-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tepla-network

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: tepla-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tepla-network

  minio:
    image: minio/minio:latest
    container_name: tepla-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tepla_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-tepla_minio_secret}
    volumes:
      - minio_data:/data
    networks:
      - tepla-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: tepla-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "devkey:devsecret"
    networks:
      - tepla-network

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  elasticsearch_data:
  minio_data:

networks:
  tepla-network:
    driver: bridge

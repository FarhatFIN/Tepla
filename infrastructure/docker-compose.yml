# Tepla Messenger — Full Stack (Infrastructure + 5 Domain Services + 3 Workers)
#
# Architecture:
#   api-gateway (3000) → auth-user-service (3001)
#                       → messaging-core-service (3004)
#                       → media-service (3007)
#                       → realtime-service (3100)
#                       → bot-service (3013)
#                       → webapp-service (3017)
#   messaging-core-service → Kafka → [search-worker, moderation-worker, analytics-worker]

services:
  postgres:
    image: postgres:16-alpine
    container_name: tepla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tepla
      POSTGRES_USER: tepla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tepla_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tepla"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepla-network

  redis:
    image: redis:7-alpine
    container_name: tepla-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tepla-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tepla-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - tepla-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tepla-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tepla-network

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: tepla-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tepla-network

  minio:
    image: minio/minio:latest
    container_name: tepla-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tepla_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-tepla_minio_secret}
    volumes:
      - minio_data:/data
    networks:
      - tepla-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: tepla-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "devkey:devsecret"
    networks:
      - tepla-network

  # ─── Application Services ───────────────────

  api-gateway:
    build:
      context: ../gateway/api-gateway
      dockerfile: Dockerfile
    container_name: tepla-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      AUTH_USER_SERVICE_URL: http://auth-user-service:3001
      MESSAGING_SERVICE_URL: http://messaging-core-service:3004
      MEDIA_SERVICE_URL: http://media-service:3007
      REALTIME_SERVICE_URL: http://realtime-service:3100
      BOT_SERVICE_URL: http://bot-service:3013
      WEBAPP_SERVICE_URL: http://webapp-service:3017
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - tepla-network

  auth-user-service:
    build:
      context: ../services/auth-user-service
      dockerfile: Dockerfile
    container_name: tepla-auth-user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tepla-network

  messaging-core-service:
    build:
      context: ../services/messaging-core-service
      dockerfile: Dockerfile
    container_name: tepla-messaging-core-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - tepla-network

  media-service:
    build:
      context: ../services/media-service
      dockerfile: Dockerfile
    container_name: tepla-media-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3007
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tepla_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tepla_minio_secret}
      S3_BUCKET: tepla-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - tepla-network

  realtime-service:
    build:
      context: ../services/realtime-service
      dockerfile: Dockerfile
    container_name: tepla-realtime-service
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - tepla-network

  bot-service:
    build:
      context: ../services/bot-service
      dockerfile: Dockerfile
    container_name: tepla-bot-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3013
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - tepla-network

  webapp-service:
    build:
      context: ../services/webapp-service
      dockerfile: Dockerfile
    container_name: tepla-webapp-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3017
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tepla-network

  # ─── Kafka Workers ─────────────────────────

  search-worker:
    build:
      context: ../services/workers/search-worker
      dockerfile: Dockerfile
    container_name: tepla-search-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - tepla-network

  moderation-worker:
    build:
      context: ../services/workers/moderation-worker
      dockerfile: Dockerfile
    container_name: tepla-moderation-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tepla-network

  analytics-worker:
    build:
      context: ../services/workers/analytics-worker
      dockerfile: Dockerfile
    container_name: tepla-analytics-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:29092
      REDIS_URL: redis://redis:6379
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tepla-network

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  elasticsearch_data:
  minio_data:

networks:
  tepla-network:
    driver: bridge

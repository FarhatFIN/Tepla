services:
  postgres:
    image: postgres:16-alpine
    container_name: tepla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tepla
      POSTGRES_USER: tepla
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tepla_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tepla"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tepla-network

  redis:
    image: redis:7-alpine
    container_name: tepla-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tepla-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: tepla-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - tepla-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: tepla-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - tepla-network

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: tepla-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - tepla-network

  minio:
    image: minio/minio:latest
    container_name: tepla-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-tepla_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-tepla_minio_secret}
    volumes:
      - minio_data:/data
    networks:
      - tepla-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: tepla-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "devkey: devsecret"
    networks:
      - tepla-network

  api-gateway:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        SERVICE_WORKDIR: gateway/api-gateway
    container_name: tepla-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-tepla-jwt-secret-change-me}
      AUTH_USER_SERVICE_URL: http://auth-user-service:3001
      MESSAGING_SERVICE_URL: http://messaging-core-service:3004
      MEDIA_SERVICE_URL: http://media-service:3007
      REALTIME_SERVICE_URL: http://realtime-service:3100
      TEPLA_ENABLE_BOT_PLATFORM: "false"
      TEPLA_ENABLE_LEGACY_FEATURES: "false"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      auth-user-service:
        condition: service_healthy
      messaging-core-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
      realtime-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - tepla-network

  auth-user-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        SERVICE_WORKDIR: services/auth-user-service
    container_name: tepla-auth-user-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      AUTH_EMAIL_OTP_REQUIRED: "false"
      PORT: 3001
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_URL: redis://redis:6379
      REDIS_PERSIST_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-tepla-jwt-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - tepla-network

  messaging-core-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        SERVICE_WORKDIR: services/messaging-core-service
    container_name: tepla-messaging-core-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - tepla-network

  media-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        SERVICE_WORKDIR: services/media-service
    container_name: tepla-media-service
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tepla_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-tepla_minio_secret}
      S3_BUCKET: tepla-media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - tepla-network

  realtime-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/node-service.Dockerfile
      args:
        SERVICE_WORKDIR: services/realtime-service
    container_name: tepla-realtime-service
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: development
      PORT: 3100
      DATABASE_URL: postgres://tepla:${POSTGRES_PASSWORD:-tepla_secret}@postgres:5432/tepla
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      livekit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - tepla-network

  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    container_name: tepla-client
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:3000
      NEXT_PUBLIC_API_URL: /api/v2
      NEXT_PUBLIC_WS_URL: http://localhost:3100
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - tepla-network

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  elasticsearch_data:
  minio_data:

networks:
  tepla-network:
    driver: bridge

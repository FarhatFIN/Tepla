services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  kafka:
    ports:
      - "9092:9092"

  elasticsearch:
    ports:
      - "9200:9200"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  livekit:
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tepla-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tepla
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - tepla-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tepla-redis-commander
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    networks:
      - tepla-network

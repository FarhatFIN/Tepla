<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#0C0818"/>

  <!-- Chat bubble 1 - rounded rect with tail -->
  <g transform="translate(40,30)" opacity="0.07">
    <rect x="0" y="0" width="36" height="24" rx="6" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
    <circle cx="11" cy="12" r="2" fill="#8B5CF6"/>
    <circle cx="18" cy="12" r="2" fill="#8B5CF6"/>
    <circle cx="25" cy="12" r="2" fill="#8B5CF6"/>
    <path d="M6 24 L2 32 L12 24" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
  </g>

  <!-- Lightning bolt -->
  <g transform="translate(140,50)" opacity="0.08">
    <path d="M12 0 L4 14 h6 L6 26 L18 10 h-6 z" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
  </g>

  <!-- Lock -->
  <g transform="translate(250,20)" opacity="0.06">
    <rect x="4" y="12" width="18" height="14" rx="3" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <path d="M8 12 V8 a5 5 0 0 1 10 0 v4" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="13" cy="20" r="2" fill="#8B5CF6"/>
  </g>

  <!-- Star 4-point -->
  <g transform="translate(370,45)" opacity="0.06">
    <path d="M8 0 L10 6 L16 8 L10 10 L8 16 L6 10 L0 8 L6 6 Z" fill="none" stroke="#8B5CF6" stroke-width="1"/>
  </g>

  <!-- Cloud -->
  <g transform="translate(460,30)" opacity="0.06">
    <path d="M10 22 h16 a6 6 0 0 0 0-12 a8 8 0 0 0-15-2 a5 5 0 0 0-7 6 a5 5 0 0 0 6 8z" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
  </g>

  <!-- Gear -->
  <g transform="translate(550,55)" opacity="0.05">
    <circle cx="10" cy="10" r="4" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="10" cy="10" r="8" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3 3.5"/>
  </g>

  <!-- Chat bubble with lightning -->
  <g transform="translate(80,120)" opacity="0.07">
    <rect x="0" y="0" width="32" height="22" rx="5" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
    <path d="M13 5 L9 13 h4 L11 18 L19 9 h-4 z" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <path d="M4 22 L0 28 L10 22" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
  </g>

  <!-- Headphones -->
  <g transform="translate(200,110)" opacity="0.06">
    <path d="M4 16 V12 a8 8 0 0 1 16 0 v4" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <rect x="1" y="14" width="5" height="8" rx="2" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <rect x="18" y="14" width="5" height="8" rx="2" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
  </g>

  <!-- Speech bubble small -->
  <g transform="translate(320,100)" opacity="0.07">
    <ellipse cx="14" cy="10" rx="14" ry="10" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="8" cy="10" r="1.5" fill="#8B5CF6"/>
    <circle cx="14" cy="10" r="1.5" fill="#8B5CF6"/>
    <circle cx="20" cy="10" r="1.5" fill="#8B5CF6"/>
    <path d="M6 18 L2 26 L14 18" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
  </g>

  <!-- Shield -->
  <g transform="translate(440,105)" opacity="0.06">
    <path d="M12 2 L2 7 V14 c0 6 10 10 10 10 s10-4 10-10 V7 z" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <polyline points="8 13 11 16 17 10" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
  </g>

  <!-- Small dots cluster -->
  <circle cx="540" cy="120" r="1.5" fill="#8B5CF6" opacity="0.06"/>
  <circle cx="548" cy="116" r="1" fill="#8B5CF6" opacity="0.05"/>
  <circle cx="544" cy="126" r="1.8" fill="#8B5CF6" opacity="0.04"/>

  <!-- Row 3 -->
  <!-- Network nodes -->
  <g transform="translate(30,210)" opacity="0.06">
    <circle cx="4" cy="4" r="3" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="22" cy="0" r="3" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="14" cy="18" r="3" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="7" y1="5" x2="19" y2="2" stroke="#8B5CF6" stroke-width="0.8"/>
    <line x1="6" y1="7" x2="12" y2="15" stroke="#8B5CF6" stroke-width="0.8"/>
    <line x1="17" y1="16" x2="21" y2="3" stroke="#8B5CF6" stroke-width="0.8"/>
  </g>

  <!-- Lightning -->
  <g transform="translate(150,220)" opacity="0.08">
    <path d="M14 0 L5 16 h7 L8 28 L21 12 h-7 z" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
  </g>

  <!-- Lock small -->
  <g transform="translate(270,200)" opacity="0.06">
    <rect x="3" y="10" width="14" height="11" rx="2.5" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <path d="M6 10 V7 a4 4 0 0 1 8 0 v3" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
  </g>

  <!-- Chat double bubble -->
  <g transform="translate(370,195)" opacity="0.07">
    <rect x="0" y="0" width="28" height="16" rx="4" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <rect x="8" y="8" width="28" height="16" rx="4" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
  </g>

  <!-- Star sparkle -->
  <g transform="translate(490,210)" opacity="0.06">
    <path d="M10 0 L12 7 L20 10 L12 13 L10 20 L8 13 L0 10 L8 7 Z" fill="none" stroke="#8B5CF6" stroke-width="1"/>
  </g>

  <!-- Small star -->
  <path d="M570 215 L572 220 L577 222 L572 224 L570 229 L568 224 L563 222 L568 220 Z" fill="#8B5CF6" opacity="0.05"/>

  <!-- Row 4 -->
  <!-- Bot/robot face -->
  <g transform="translate(60,310)" opacity="0.06">
    <rect x="2" y="6" width="22" height="16" rx="4" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="9" cy="14" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="17" cy="14" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <line x1="13" y1="2" x2="13" y2="6" stroke="#8B5CF6" stroke-width="1"/>
    <circle cx="13" cy="1" r="1.5" fill="#8B5CF6"/>
  </g>

  <!-- Chat bubble right tail -->
  <g transform="translate(180,300)" opacity="0.07">
    <rect x="0" y="0" width="34" height="22" rx="5" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
    <circle cx="10" cy="11" r="2" fill="#8B5CF6"/>
    <circle cx="17" cy="11" r="2" fill="#8B5CF6"/>
    <circle cx="24" cy="11" r="2" fill="#8B5CF6"/>
    <path d="M28 22 L34 30 L22 22" fill="none" stroke="#8B5CF6" stroke-width="1.4"/>
  </g>

  <!-- Cloud upload -->
  <g transform="translate(310,305)" opacity="0.06">
    <path d="M8 20 h14 a5 5 0 0 0 0-10 a7 7 0 0 0-13-2 a4 4 0 0 0-5 5 a4 4 0 0 0 4 7z" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <line x1="15" y1="22" x2="15" y2="14" stroke="#8B5CF6" stroke-width="1"/>
    <polyline points="12 17 15 14 18 17" fill="none" stroke="#8B5CF6" stroke-width="1"/>
  </g>

  <!-- Gear -->
  <g transform="translate(430,310)" opacity="0.06">
    <circle cx="12" cy="12" r="5" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="12" cy="12" r="9" fill="none" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3.5 3"/>
  </g>

  <!-- Lightning small -->
  <g transform="translate(540,300)" opacity="0.07">
    <path d="M10 0 L4 12 h5 L6 20 L16 8 h-5 z" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
  </g>

  <!-- Row 5 -->
  <!-- VR headset -->
  <g transform="translate(40,400)" opacity="0.06">
    <path d="M2 12 a10 8 0 0 1 28 0" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <ellipse cx="10" cy="14" rx="6" ry="5" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <ellipse cx="22" cy="14" rx="6" ry="5" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <line x1="16" y1="14" x2="16" y2="14" stroke="#8B5CF6" stroke-width="2"/>
  </g>

  <!-- Chat bubble -->
  <g transform="translate(160,410)" opacity="0.07">
    <rect x="0" y="0" width="30" height="20" rx="5" fill="none" stroke="#8B5CF6" stroke-width="1.3"/>
    <circle cx="9" cy="10" r="1.8" fill="#8B5CF6"/>
    <circle cx="15" cy="10" r="1.8" fill="#8B5CF6"/>
    <circle cx="21" cy="10" r="1.8" fill="#8B5CF6"/>
  </g>

  <!-- Lock -->
  <g transform="translate(280,395)" opacity="0.06">
    <rect x="4" y="12" width="16" height="12" rx="2.5" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <path d="M7 12 V8 a5 5 0 0 1 10 0 v4" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="12" cy="19" r="1.5" fill="#8B5CF6"/>
  </g>

  <!-- Star -->
  <g transform="translate(400,405)" opacity="0.05">
    <path d="M10 0 L12.5 7 L20 10 L12.5 13 L10 20 L7.5 13 L0 10 L7.5 7 Z" fill="none" stroke="#8B5CF6" stroke-width="1"/>
  </g>

  <!-- Headphones -->
  <g transform="translate(500,400)" opacity="0.06">
    <path d="M4 14 V10 a7 7 0 0 1 14 0 v4" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <rect x="1" y="12" width="5" height="7" rx="2" fill="none" stroke="#8B5CF6" stroke-width="1.1"/>
    <rect x="16" y="12" width="5" height="7" rx="2" fill="none" stroke="#8B5CF6" stroke-width="1.1"/>
  </g>

  <!-- Row 6 -->
  <!-- Network -->
  <g transform="translate(90,500)" opacity="0.05">
    <circle cx="0" cy="10" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="0.9"/>
    <circle cx="16" cy="0" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="0.9"/>
    <circle cx="24" cy="16" r="2.5" fill="none" stroke="#8B5CF6" stroke-width="0.9"/>
    <line x1="2" y1="8" x2="14" y2="2" stroke="#8B5CF6" stroke-width="0.7"/>
    <line x1="18" y1="2" x2="22" y2="14" stroke="#8B5CF6" stroke-width="0.7"/>
    <line x1="2" y1="12" x2="22" y2="16" stroke="#8B5CF6" stroke-width="0.7"/>
  </g>

  <!-- Shield -->
  <g transform="translate(220,490)" opacity="0.06">
    <path d="M10 2 L2 6 V12 c0 5 8 8 8 8 s8-3 8-8 V6 z" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
  </g>

  <!-- Lightning -->
  <g transform="translate(340,500)" opacity="0.07">
    <path d="M12 0 L5 14 h6 L7 24 L19 10 h-6 z" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
  </g>

  <!-- Chat bubble small -->
  <g transform="translate(450,495)" opacity="0.06">
    <ellipse cx="12" cy="9" rx="12" ry="9" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
    <circle cx="7" cy="9" r="1.3" fill="#8B5CF6"/>
    <circle cx="12" cy="9" r="1.3" fill="#8B5CF6"/>
    <circle cx="17" cy="9" r="1.3" fill="#8B5CF6"/>
  </g>

  <!-- Scattered dots -->
  <circle cx="560" cy="500" r="1.5" fill="#8B5CF6" opacity="0.05"/>
  <circle cx="20" cy="560" r="1" fill="#8B5CF6" opacity="0.04"/>
  <circle cx="300" cy="570" r="1.5" fill="#8B5CF6" opacity="0.05"/>
  <circle cx="500" cy="560" r="1.2" fill="#8B5CF6" opacity="0.04"/>
  <circle cx="180" cy="170" r="1" fill="#8B5CF6" opacity="0.04"/>
  <circle cx="420" cy="160" r="1.3" fill="#8B5CF6" opacity="0.04"/>
  <circle cx="100" cy="460" r="1" fill="#8B5CF6" opacity="0.03"/>
  <circle cx="350" cy="360" r="1.5" fill="#8B5CF6" opacity="0.04"/>
</svg>
# Tepla CI — crypto core verification.
# Runs on merge requests and on the default branch.

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

crypto-tests:
  stage: test
  image: node:22-alpine
  script:
    - cd shared/crypto
    - npm install --no-audit --no-fund
    - npm run test

crypto-typecheck:
  stage: test
  image: node:22-alpine
  allow_failure: true
  script:
    - cd shared/crypto
    - npm install --no-audit --no-fund
    - npx tsc -p tsconfig.json --noEmit
